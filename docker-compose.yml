version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diet-recommendation-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEBUG=False
    volumes:
      - ./Data:/app/Data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: diet-recommendation-tests
    volumes:
      - .:/app
      - /app/__pycache__
    environment:
      - PYTHONUNBUFFERED=1
    command: pytest tests/ -v --cov=FastAPI_Backend --cov-report=html
